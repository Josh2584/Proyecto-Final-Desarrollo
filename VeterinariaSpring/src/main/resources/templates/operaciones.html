<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Operaciones - Gran Malo</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<div th:replace="~{fragments/layout :: sidebar(${pagina})}"></div>
<main class="main">
    <header class="topbar">
        <div>
            <h1>Operaciones quirúrgicas</h1>
            <p class="topbar-sub">Historial de cirugías realizadas a los animales</p>
        </div>
        <a th:if="${puedeOperar}" th:href="@{/operaciones/nueva}" class="btn-primary">Nueva cirugía</a>
    </header>
    <section class="content">
        <form th:action="@{/operaciones}" method="get" class="filters-bar">
            <div class="search-box wide">
                <input name="buscar" placeholder="Buscar por animal o tipo de cirugía..." th:value="${buscar}">
            </div>
            <button class="btn-primary" type="submit">Buscar</button>
            <a th:if="${buscar != null}" th:href="@{/operaciones}" class="clear-link">Limpiar</a>
        </form>
        <div class="table-card">
            <div class="table-header">
                <h2>Cirugías</h2>
                <span class="count-badge" th:text="${#lists.size(cirugias)} + ' registros'"></span>
            </div>
            <div th:if="${#lists.isEmpty(cirugias)}" class="empty-state">No se encontraron cirugías registradas.</div>
            <table th:unless="${#lists.isEmpty(cirugias)}" class="data-table">
                <thead>
                <tr>
                    <th>ID</th><th>Fecha</th><th>Animal</th><th>Tipo de cirugía</th>
                    <th>Descripción</th><th>Cirujano</th><th>Costo</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="cg : ${cirugias}">
                    <td class="muted" th:text="'#' + ${cg.id}"></td>
                    <td class="muted" th:text="${cg.fecha == null ? '-' : #temporals.format(cg.fecha, 'dd/MM/yyyy')}"></td>
                    <td><strong th:text="${cg.animal ?: '-'}"></strong></td>
                    <td th:text="${cg.tipo ?: '-'}"></td>
                    <td class="muted" th:text="${cg.descripcion ?: '-'}"></td>
                    <td class="muted" th:text="${cg.empleado ?: '-'}"></td>
                    <td>
                        <strong th:if="${cg.costo != null}" th:text="'$' + ${#numbers.formatDecimal(cg.costo, 1, 'COMMA', 2, 'POINT')}"></strong>
                        <span th:unless="${cg.costo != null}" class="muted">-</span>
                    </td>
                </tr>
                </tbody>
            </table>
        </div>
    </section>
</main>
</body>
</html>
