<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<body>
<aside class="sidebar" th:fragment="sidebar(pagina)">
    <div class="sidebar-logo">
        <div class="logo-title">Gran Malo</div>
        <div class="logo-sub">Sistema veterinario</div>
        <div class="user-chip" th:if="${usuarioActual != null}">
            <strong th:text="${usuarioActual.displayName()}">Usuario</strong>
            <span th:text="${usuarioActual.role().label()}">Rol</span>
        </div>
    </div>
    <nav class="sidebar-nav">
        <div class="sidebar-section">General</div>
        <a th:href="@{/}" class="nav-link" th:classappend="${pagina == 'index'} ? ' active'">
            <span class="nav-icon">⌂</span><span>Inicio</span>
        </a>
        <a th:href="@{/carrito}" class="nav-link" th:classappend="${pagina == 'carrito'} ? ' active'">
            <span class="nav-icon">□</span><span>Carrito</span>
        </a>
        <div class="sidebar-section">Catálogos</div>
        <a th:href="@{/mascotas}" class="nav-link" th:classappend="${pagina == 'mascotas'} ? ' active'">
            <span class="nav-icon">◇</span><span>Animales</span>
        </a>
        <a th:href="@{/productos}" class="nav-link" th:classappend="${pagina == 'productos'} ? ' active'">
            <span class="nav-icon">□</span><span>Productos</span>
        </a>
        <div class="sidebar-section" th:if="${puedeConsultar || puedeOperar}">Clínica</div>
        <a th:if="${puedeConsultar}" th:href="@{/consultas}" class="nav-link" th:classappend="${pagina == 'consultas'} ? ' active'">
            <span class="nav-icon">☤</span><span>Consultas</span>
        </a>
        <a th:if="${puedeOperar}" th:href="@{/operaciones}" class="nav-link" th:classappend="${pagina == 'operaciones'} ? ' active'">
            <span class="nav-icon">✚</span><span>Operaciones</span>
        </a>
        <form th:action="@{/logout}" method="post" class="logout-form">
            <button type="submit" class="logout-button">Cerrar sesión</button>
        </form>
    </nav>
</aside>
</body>
</html>
