<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Productos - Gran Malo</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<div th:replace="~{fragments/layout :: sidebar(${pagina})}"></div>
<main class="main">
    <header class="topbar">
        <div>
            <h1>Catálogo de productos</h1>
            <p class="topbar-sub">Inventario de medicamentos, alimentos y accesorios</p>
        </div>
        <a th:if="${puedeVender}" th:href="@{/productos/venta}" class="btn-primary">Nueva venta</a>
    </header>
    <section class="content">
        <div class="metrics-grid compact">
            <div class="metric-card"><span class="metric-label">Total de productos</span><span class="metric-value" th:text="${#lists.size(productos)}"></span></div>
            <div class="metric-card"><span class="metric-label">Sin existencia</span><span class="metric-value" th:text="${sinStock}"></span></div>
            <div class="metric-card"><span class="metric-label">Requieren receta</span><span class="metric-value" th:text="${requierenReceta}"></span></div>
        </div>
        <form th:action="@{/productos}" method="get" class="filters-bar">
            <div class="search-box"><input name="buscar" placeholder="Buscar producto..." th:value="${buscar}"></div>
            <select name="categoria" class="filter-select">
                <option value="">Todas las categorías</option>
                <option th:each="cat : ${categorias}" th:value="${cat.id}" th:text="${cat.nombre}" th:selected="${categoriaSeleccionada == cat.id}"></option>
            </select>
            <select name="receta" class="filter-select">
                <option value="">Con y sin receta</option>
                <option value="S" th:selected="${receta == 'S'}">Requiere receta</option>
                <option value="N" th:selected="${receta == 'N'}">Sin receta</option>
            </select>
            <button class="btn-primary" type="submit">Filtrar</button>
            <a th:if="${buscar != null || categoriaSeleccionada != null || receta != null}" th:href="@{/productos}" class="clear-link">Limpiar filtros</a>
        </form>
        <div class="table-card">
            <div class="table-header"><h2>Productos</h2><span class="count-badge" th:text="${#lists.size(productos)} + ' registros'"></span></div>
            <div th:if="${#lists.isEmpty(productos)}" class="empty-state">No se encontraron productos con esos filtros.</div>
            <table th:unless="${#lists.isEmpty(productos)}" class="data-table">
                <thead><tr><th>ID</th><th>Descripción</th><th>Categoría</th><th>Precio lista</th><th>Existencia</th><th>Receta</th></tr></thead>
                <tbody>
                <tr th:each="p : ${productos}">
                    <td class="muted" th:text="'#' + ${p.id}"></td>
                    <td><strong th:text="${p.descripcion}"></strong></td>
                    <td class="muted" th:text="${p.categoria ?: '-'}"></td>
                    <td><strong th:text="'$' + ${#numbers.formatDecimal(p.precioLista, 1, 'COMMA', 2, 'POINT')}"></strong></td>
                    <td><span class="badge" th:classappend="${p.existencia == 0 ? ' badge-vendido' : (p.existencia <= 5 ? ' badge-adopcion' : ' badge-disponible')}" th:text="${p.existencia == 0 ? 'Sin stock' : p.existencia + ' unid.'}"></span></td>
                    <td><span class="badge" th:classappend="${p.requiereReceta == 'S' ? ' badge-receta' : ' badge-libre'}" th:text="${p.requiereReceta == 'S' ? 'Sí requiere' : 'No requiere'}"></span></td>
                </tr>
                </tbody>
            </table>
        </div>
    </section>
</main>
</body>
</html>
