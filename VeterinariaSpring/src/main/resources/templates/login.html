<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Acceso - Veterinaria Gran Malo</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body class="login-page">
<main class="login-shell">
    <section class="login-panel">
        <div>
            <div class="login-brand">Gran Malo</div>
            <h1>Acceso al sistema</h1>
            <p>Ingresa con el usuario asignado para ver las funciones disponibles.</p>
        </div>
        <div th:if="${error}" class="error-msg login-error" th:text="${error}"></div>
        <form th:action="@{/login}" method="post" class="login-form">
            <label>Usuario
                <input name="username" th:value="${username}" required autofocus autocomplete="username" placeholder="cajero">
            </label>
            <label>Contraseña
                <input type="password" name="password" required autocomplete="current-password" placeholder="•••••">
            </label>
            <button class="btn-submit" type="submit">Entrar</button>
        </form>
        <div class="login-help">
            Usuarios: cajero, veterinario, cirujano, admin
        </div>
    </section>
</main>
</body>
</html>
