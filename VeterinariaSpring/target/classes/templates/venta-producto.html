<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Venta de producto - Gran Malo</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<div th:replace="~{fragments/layout :: sidebar(${pagina})}"></div>
<main class="main">
    <header class="topbar"><div><h1>Venta de producto</h1><p class="topbar-sub">Registrar una nueva venta de producto</p></div><a th:href="@{/productos}" class="clear-link">Volver</a></header>
    <section class="content">
        <div th:if="${error}" class="error-msg" th:text="${error}"></div>
        <form th:action="@{/productos/venta}" method="post" class="form-card">
            <div th:if="${clienteFijadoId != null}" class="info-box session-lock">
                🧑 Cliente: <strong th:text="${clienteFijadoNombre}">Cliente</strong> · 💳 Pago: <strong th:text="${metodoPagoFijado}">Pago</strong>
            </div>
            <label>Producto
                <select name="productoId" id="productoSelect" required onchange="actualizarProducto()">
                    <option value="">Selecciona un producto</option>
                    <option th:each="p : ${productos}" th:value="${p.id}" th:data-precio="${p.precio ?: 0}" th:data-stock="${p.existencia}" th:text="${p.nombre + ' (Stock: ' + p.existencia + ')'}"></option>
                </select>
            </label>
            <div class="info-box" id="infoBox">Precio lista: $<span id="precioRef">0.00</span> · Stock disponible: <span id="stockRef">0</span></div>
            <label>Cantidad<input type="number" name="cantidad" id="cantidad" min="1" value="1" required oninput="calcularTotal()"></label>
            <label>Precio unitario ($)<input type="number" name="precioVenta" id="precioVenta" min="0" step="0.01" required oninput="calcularTotal()"></label>
            <div class="total-preview" id="totalPreview">Total: $<span id="totalValor">0.00</span></div>
            <label th:if="${clienteFijadoId != null}">Cliente
                <span class="fixed-field" th:text="${clienteFijadoNombre}">Cliente fijado</span>
                <input type="hidden" name="clienteId" th:value="${clienteFijadoId}">
            </label>
            <label th:unless="${clienteFijadoId != null}">Cliente<select name="clienteId" required><option value="">Selecciona un cliente</option><option th:each="c : ${clientes}" th:value="${c.id}" th:text="${c.nombre}"></option></select></label>
            <label>Empleado que atiende<select name="empleadoId" required><option value="">Selecciona un empleado</option><option th:each="e : ${empleados}" th:value="${e.id}" th:text="${e.nombre}"></option></select></label>
            <label th:if="${clienteFijadoId != null}">Método de pago
                <span class="fixed-field" th:text="${metodoPagoFijado}">Método fijado</span>
                <input type="hidden" name="metodoPago" th:value="${metodoPagoFijado}">
            </label>
            <label th:unless="${clienteFijadoId != null}">Método de pago<select name="metodoPago" required><option value="Efectivo">Efectivo</option><option value="Tarjeta">Tarjeta</option><option value="Mixto">Mixto</option></select></label>
            <button class="btn-submit" type="submit">Agregar al carrito</button>
        </form>
    </section>
</main>
<script>
function actualizarProducto() {
    const select = document.getElementById('productoSelect');
    const option = select.options[select.selectedIndex];
    const precio = parseFloat(option.dataset.precio || '0');
    const stock = parseInt(option.dataset.stock || '0', 10);
    document.getElementById('precioRef').textContent = precio.toFixed(2);
    document.getElementById('stockRef').textContent = stock;
    document.getElementById('precioVenta').value = precio.toFixed(2);
    document.getElementById('cantidad').max = stock;
    document.getElementById('infoBox').style.display = precio > 0 ? 'block' : 'none';
    calcularTotal();
}
function calcularTotal() {
    const precio = parseFloat(document.getElementById('precioVenta').value || '0');
    const cantidad = parseInt(document.getElementById('cantidad').value || '0', 10);
    const total = precio * cantidad;
    document.getElementById('totalValor').textContent = total.toFixed(2);
    document.getElementById('totalPreview').style.display = total > 0 ? 'block' : 'none';
}
</script>
</body>
</html>
