<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mascotas - Gran Malo</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<div th:replace="~{fragments/layout :: sidebar(${pagina})}"></div>
<main class="main">
    <header class="topbar">
        <div>
            <h1>Mascotas disponibles</h1>
            <p class="topbar-sub">Animales sin dueño asignado, disponibles para venta o adopción</p>
        </div>
        <a th:if="${puedeVender}" th:href="@{/mascotas/venta}" class="btn-primary">Nueva venta / adopción</a>
    </header>
    <section class="content">
        <form th:action="@{/mascotas}" method="get" class="filters-bar">
            <div class="search-box"><input name="nombre" placeholder="Buscar por nombre..." th:value="${nombre}"></div>
            <select name="genero" class="filter-select">
                <option value="">Todos los géneros</option>
                <option value="Macho" th:selected="${genero == 'Macho'}">Macho</option>
                <option value="Hembra" th:selected="${genero == 'Hembra'}">Hembra</option>
            </select>
            <select name="categoria" class="filter-select">
                <option value="">Todas las categorías</option>
                <option th:each="cat : ${categorias}" th:value="${cat.id}" th:text="${cat.nombre}" th:selected="${categoriaSeleccionada == cat.id}"></option>
            </select>
            <button type="submit" class="btn-primary">Filtrar</button>
            <a th:if="${nombre != null || genero != null || categoriaSeleccionada != null}" th:href="@{/mascotas}" class="clear-link">Limpiar filtros</a>
        </form>
        <div class="table-card">
            <div class="table-header">
                <h2>Animales</h2>
                <span class="count-badge" th:text="${#lists.size(animales)} + ' registros'"></span>
            </div>
            <div th:if="${#lists.isEmpty(animales)}" class="empty-state">No se encontraron animales con esos filtros.</div>
            <table th:unless="${#lists.isEmpty(animales)}" class="data-table">
                <thead>
                <tr><th>ID</th><th>Nombre</th><th>Categoría</th><th>Raza</th><th>Género</th><th>Color</th><th>Nacimiento</th><th>Precio lista</th></tr>
                </thead>
                <tbody>
                <tr th:each="a : ${animales}">
                    <td class="muted" th:text="'#' + ${a.id}"></td>
                    <td><strong th:text="${a.nombre ?: '-'}"></strong></td>
                    <td><span class="badge badge-disponible" th:text="${a.categoria ?: '-'}"></span></td>
                    <td class="muted" th:text="${a.raza ?: '-'}"></td>
                    <td><span class="badge badge-libre" th:text="${a.genero ?: '-'}"></span></td>
                    <td class="muted" th:text="${a.color ?: '-'}"></td>
                    <td class="muted" th:text="${a.fechaNacimiento == null ? '-' : #temporals.format(a.fechaNacimiento, 'dd/MM/yyyy')}"></td>
                    <td><strong th:if="${a.precioLista != null}" th:text="'$' + ${#numbers.formatDecimal(a.precioLista, 1, 'COMMA', 2, 'POINT')}"></strong><span th:unless="${a.precioLista != null}" class="muted">-</span></td>
                </tr>
                </tbody>
            </table>
        </div>
    </section>
</main>
</body>
</html>
