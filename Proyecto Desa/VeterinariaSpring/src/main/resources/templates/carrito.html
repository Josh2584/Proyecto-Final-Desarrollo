<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Carrito - Gran Malo</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<div th:replace="~{fragments/layout :: sidebar(${pagina})}"></div>
<main class="main">
    <header class="topbar">
        <div>
            <h1>Carrito</h1>
            <p class="topbar-sub">Revisa las operaciones antes de generar el ticket</p>
        </div>
        <a th:href="@{/}" class="clear-link">Seguir agregando</a>
    </header>
    <section class="content">
        <div th:if="${mensaje}" class="success-msg" th:text="${mensaje}"></div>
        <div th:if="${error}" class="error-msg" th:text="${error}"></div>

        <div class="table-card">
            <div class="table-header">
                <h2>Operaciones pendientes</h2>
                <span class="count-badge" th:text="${cart.count} + ' elemento(s)'"></span>
            </div>
            <div th:if="${cart.empty}" class="empty-state">El carrito está vacío.</div>
            <table th:unless="${cart.empty}" class="data-table">
                <thead>
                <tr><th>Tipo</th><th>Detalle</th><th>Cliente / Empleado</th><th>Cantidad</th><th>Total</th><th></th></tr>
                </thead>
                <tbody>
                <tr th:each="item : ${cart.items}">
                    <td><span class="badge badge-libre" th:text="${item.kind}"></span></td>
                    <td>
                        <strong th:text="${item.resumen}"></strong>
                        <div class="muted" th:if="${item.metodoPago != null}" th:text="'Pago: ' + ${item.metodoPago}"></div>
                    </td>
                    <td class="muted">
                        <div th:if="${item.clienteNombre != null}" th:text="'Cliente: ' + ${item.clienteNombre}"></div>
                        <div th:text="'Empleado: ' + ${item.empleadoNombre}"></div>
                    </td>
                    <td th:text="${item.cantidad}"></td>
                    <td><strong th:text="'$' + ${#numbers.formatDecimal(item.total, 1, 'COMMA', 2, 'POINT')}"></strong></td>
                    <td>
                        <form th:action="@{/carrito/remover}" method="post">
                            <input type="hidden" name="itemId" th:value="${item.id}">
                            <button type="submit" class="btn-secondary">Quitar</button>
                        </form>
                    </td>
                </tr>
                </tbody>
            </table>
        </div>

        <div th:unless="${cart.empty}" class="cart-actions">
            <div class="ticket-total cart-total">
                <span>Total estimado</span>
                <strong th:text="'$' + ${#numbers.formatDecimal(cart.total, 1, 'COMMA', 2, 'POINT')}"></strong>
            </div>
            <form th:action="@{/carrito/finalizar}" method="post">
                <button type="submit" class="btn-primary">Generar ticket y guardar en base de datos</button>
            </form>
        </div>
    </section>
</main>
</body>
</html>
